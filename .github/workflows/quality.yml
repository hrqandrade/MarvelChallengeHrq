name: Quality

on:
  pull_request:
    branches:
      - develop
      - master
  push:
    branches:
      - develop
      - master

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format and lint
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Mint
        run: brew install mint

      - name: Cache Mint packages
        uses: actions/cache@v4
        with:
          path: ~/.mint
          key: ${{ runner.os }}-mint-${{ hashFiles('Mintfile') }}

      - name: Bootstrap quality tools
        run: make bootstrap

      - name: Validate formatting and lint
        run: make quality

  tests:
    name: Build and tests
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"

      - name: Prepare iOS Simulator
        id: simulator
        run: |
          simulator_id=$(xcrun simctl create "MarvelChallenge CI" \
            com.apple.CoreSimulator.SimDeviceType.iPhone-16-Pro \
            com.apple.CoreSimulator.SimRuntime.iOS-18-5)
          xcrun simctl boot "$simulator_id"
          xcrun simctl bootstatus "$simulator_id" -b
          echo "destination=platform=iOS Simulator,id=$simulator_id" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          TEST_DESTINATION: ${{ steps.simulator.outputs.destination }}
        run: make build DESTINATION="$TEST_DESTINATION"

      - name: Run tests
        env:
          TEST_DESTINATION: ${{ steps.simulator.outputs.destination }}
        run: make test DESTINATION="$TEST_DESTINATION"
